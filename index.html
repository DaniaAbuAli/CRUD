<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Products CRUD System</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/all.min.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <section class="crud">
      <div class="container">
        <h1 class="text-center mt-5">Products CRUD System</h1>
        <div
          class="buttons mt-5 d-md-flex justify-content-between align-items-center"
        >
          <div class="input-group mt-2">
            <input
              type="text"
              class="form-control"
              placeholder="Search"
              aria-label="Recipient's username"
              aria-describedby="basic-addon2"
            />
            <div class="input-group-append">
              <button class="btn btn-outline-warning search-name" type="button">
                Search by name
              </button>
              <button
                class="btn btn-outline-warning search-category"
                type="button"
              >
                Search by category
              </button>
            </div>
          </div>
          <div class="right mt-2">
            <button
              type="button"
              class="btn btn-warning text-light"
              data-bs-toggle="modal"
              data-bs-target="#exampleModal"
              data-bs-whatever="@fat"
            >
              Add Product
            </button>
            <div
              class="modal fade"
              id="exampleModal"
              tabindex="-1"
              aria-labelledby="exampleModalLabel"
              aria-hidden="true"
            >
              <div class="modal-dialog">
                <div class="modal-content">
                  <div class="modal-header">
                    <h5 class="modal-title" id="exampleModalLabel">
                      Add Product
                    </h5>
                    <button
                      type="button"
                      class="btn-close"
                      data-bs-dismiss="modal"
                      aria-label="Close"
                    ></button>
                  </div>
                  <div class="modal-body">
                    <form>
                      <div class="mb-3">
                        <label for="product-name" class="col-form-label"
                          >Product Name :</label
                        >
                        <input
                          type="text"
                          class="form-control"
                          id="product-name"
                        />
                      </div>
                      <div class="mb-3">
                        <label for="productCategory" class="col-form-label"
                          >Category :</label
                        >
                        <select id="productCategory" class="form-select">
                          <option disabled selected>Choose a category</option>
                          <option value="TV">TV</option>
                          <option value="Laptop">Laptop</option>
                          <option value="Phone">Phone</option>
                        </select>
                      </div>
                      <div class="mb-3 quantity">
                        <label for="quantity" class="col-form-label"
                          >Quantity :</label
                        >
                        <input type="text" class="form-control" id="quantity" />
                      </div>
                      <div class="mb-3">
                        <label for="price" class="col-form-label"
                          >Price :</label
                        >
                        <input type="text" class="form-control" id="price" />
                      </div>
                      <div class="mb-3">
                        <label for="rating" class="col-form-label"
                          >Rating :</label
                        >
                        <input
                          type="text"
                          class="form-control"
                          id="rating"
                          placeholder="Enter a rating between 1 and 5"
                        />
                      </div>
                    </form>
                  </div>
                  <div class="modal-footer">
                    <button
                      type="button"
                      class="btn btn-danger cancel"
                      data-bs-dismiss="modal"
                    >
                      Cancel
                    </button>
                    <button
                      type="button"
                      class="btn btn-warning text-light add-product add"
                    >
                      Add Product
                    </button>
                  </div>
                </div>
              </div>
            </div>

            <button class="btn btn-danger text-light delete-all">
              Delete All
            </button>
          </div>
        </div>
        <table class="table table-striped mt-5">
          <thead>
            <tr>
              <th scope="col">ID</th>
              <th scope="col">Name</th>
              <th scope="col">Category</th>
              <th scope="col">Price</th>
              <th scope="col">Rating</th>
              <th scope="col">Created At</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.all.min.js"></script>
    <script src="js/all.min.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
